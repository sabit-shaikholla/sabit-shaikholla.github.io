params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Sabit Shaikholla
  description: "Personal website of Sabit Shaikholla, AI/LLM Engineer and Forward Deployed Engineer. Notes on RAG, LLM agents, evaluation, model serving, and system architecture."
  author: Sabit Shaikholla
  images:
    - "/images/profile.jpg"
  schema:
    publisherType: Person
    sameAs:
      - "https://github.com/sabit-shaikholla"
      - "https://www.linkedin.com/in/sabit-shaikholla"
      - "https://orcid.org/0000-0003-3690-7328"
      - "https://scholar.google.com/citations?user=Xmf7VY4AAAAJ"
  defaultTheme: dark
  disableThemeToggle: false

  homeInfoParams:
    Title: "Hi there 👋"
    Content: >
      Welcome to my personal website!

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  
  comments: true

  # Giscus comments (GitHub Discussions-backed).
  # After enabling Discussions on the repo and installing https://github.com/apps/giscus,
  # fill in repoID and categoryID from https://giscus.app
  giscus:
    repo: "sabit-shaikholla/sabit-shaikholla.github.io"
    repoID: "R_kgDON5rJbA"
    category: "General"
    categoryID: "DIC_kwDON5rJbM4DEGkb"
    mapping: "pathname"
    theme: "preferred_color_scheme"
  hidemeta: false
  hideSummary: false
  showtoc: true

  assets:
    disableHLJS: true
    # disableFingerprinting: true
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    appleTouchIcon: "apple-touch-icon.png"

  profileMode:
    enabled: true
    title: Sabit Shaikholla
    subtitle: >
      **AI/LLM Engineer** | **Forward Deployed Engineer**
      <br><br>
      I build RAG and agent systems over internal company data, and deploy LLMs on our own hardware
      with vLLM and SGLang. Most of the work now is getting retrieval and evaluation good enough
      that people trust the answers.
      <br><br>
      Before that, backend and systems engineering: Spring Boot microservices, event-driven BSS/OSS
      integration, and a stint leading a team of 10 on apps with a few million monthly users.
      Much of it customer facing, so I spend about as much time working out what someone needs as building it.
      <br><br>
      I write up what I learn here. Also a football fan.
      <br><br>
      Open to AI/LLM and forward deployed engineering roles.
      Email is fastest: saba.shaiholla@gmail.com

    imageUrl: "/images/profile.jpg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: Profile Picture
    buttons:
      - name: Career
        url: /career/
      - name: Projects
        url: /projects/
      - name: Writing
        url: /writing/

  socialIcons:
